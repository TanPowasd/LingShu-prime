# Liyang/ 发布目录的打包定义（stab-r3 #3）：可安装的发行包是 lingshu_ng（灵枢记忆引擎重写版）。
# 源文件：wt-stab release/Liyang/pyproject.toml，发布时复制为 Liyang/pyproject.toml。
# rel-v1.17 及以前本文件沿用上游 lingshu 身体侧包定义（name="lingshu"，同时装入旧包副本 lingshu/）；
# 自 rel-v1.18 起只打包 lingshu_ng，旧包副本 lingshu/ 只用于仓内差分测试，不进发行包（避免与上游 lingshu 冲突）。
[build-system]
requires = ["setuptools>=77"]  # PEP 639 SPDX license 字符串
build-backend = "setuptools.build_meta"

[project]
name = "lingshu-ng"
dynamic = ["version"]          # 唯一来源：lingshu_ng.__version__（= CHANGELOG_rel-vX.Y 的 X.Y.0）
description = "灵枢记忆引擎重写版（lingshu_ng）：零 LLM 写入、原文召回、核心纯标准库；可选本地 ONNX 语义件"
readme = "README.md"
requires-python = ">=3.11"     # 实测 3.11 / 3.12 / 3.13（tools/ci/multi_python.sh）
license = "MIT"
license-files = ["LICENSE"]
dependencies = []              # 核心纯标准库：不装任何 extras 即可构造引擎、写入、召回

[project.scripts]
# stab-r6：命令行入口（等同 python -m lingshu_ng），子命令 serve / mcp / perceive / recall / status / capabilities / version
lingshu-ng = "lingshu_ng.integrations.cli:main"

[project.optional-dependencies]
# 版本区间依据实测（Python 3.12.15：onnxruntime 1.31.0 · tokenizers 0.23.3 · numpy 2.5.4 · Pillow 12.3.0；
# numpy 2.3.5/2.4.2、Pillow 12.2.0 见上游 2026-10-08 矩阵）。区间外未测不承诺。
# embed：中英文可选语义件（交叉编码重排 / 稠密向量，lingshu_ng.semrank、lingshu_ng.embed）。模型权重不随包发布，
#        需自备 bge 系 ONNX 模型目录（见 docs/API_ng.md「可选依赖」）；缺依赖或缺模型时逐位退回无模型路径。
embed = ["numpy>=2.3.5,<2.6", "onnxruntime>=1.31,<2", "tokenizers>=0.23,<1"]
# world / nn / gen：ng 世界线、自研神经网络与图像生成重写（numpy；渲染用 Pillow）
world = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
nn = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
gen = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
full = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13", "onnxruntime>=1.31,<2", "tokenizers>=0.23,<1"]
dev = ["pytest"]

[project.urls]
Source = "https://github.com/TanPowasd/LingShu-prime/tree/main/Liyang"
Upstream = "https://github.com/FuRongJun-1999/lingshu"

[tool.setuptools.dynamic]
version = { attr = "lingshu_ng.__version__" }

[tool.setuptools.packages.find]
include = ["lingshu_ng", "lingshu_ng.*"]
exclude = ["lingshu_ng.*.__pycache__"]
