[build-system]
requires = ["setuptools>=77"]  # #237：PEP 639 SPDX license 字符串
build-backend = "setuptools.build_meta"

[project]
name = "lingshu"
version = "0.0.1"
description = "灵枢 · 完整 AI 生命载体（灵×脑×身）——身体侧代码主体：存算一体 / 世界模型 / 自研神经网络 / 图像生成"
readme = "README.md"
requires-python = ">=3.11"  # #209：extras 下界 numpy>=2.3.5 只有 cp311+ wheel
license = "MIT"  # #237：弃用的表格写法改 SPDX 表达式
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# 轻核承诺：core 纯标准库（不装任何 extras 也可运行）
# 版本区间依据＝2026-10-08 实测矩阵（Python 3.12.x：numpy 2.3.5/2.4.2/2.5.3 · Pillow 12.2.0/12.3.0），
# 区间外未测不承诺（外部报告 issue #4）；本发布目录的安装与依赖说明见 Liyang/README.md §3。
# world 的 render()（ng world.compat / 旧 world3d 等）用 Pillow（#253）
world = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
nn = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
gen = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
full = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
dev = ["pytest"]
# 可选能力面（#253）：未进已测矩阵，只声明包名不设区间、不进 full。accel：旧 core/activation 的 SciPy CSR
# 分支；data：旧 nn/hex_train.load_cifar10_parquet；diffusion：旧 gen/hexgen_multi_seed.gen。
accel = ["scipy"]
data = ["pyarrow"]
diffusion = ["torch", "diffusers"]
# 发布副本新增（Liyang/，ng 源仓库未改）：ng 可选语义第二路 lingshu_ng/embed（ONNX 编码器）。
# 只声明包名不设区间、不进 full；另需自备 bge 系 ONNX 模型目录并设 LINGSHU_NG_EMBED_MODEL，缺依赖时引擎退回纯词面。
semantic = ["onnxruntime", "tokenizers"]

[tool.setuptools.packages.find]
include = ["lingshu*"]

[tool.setuptools.package-data]
# nn 模块附属固化物（白箱固化产物，JSON 可直读；见 docs/intake/body-export-v0.2/）
"lingshu.nn" = ["assets/*.json"]
