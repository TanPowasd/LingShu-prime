# lingshu-ng-embed：灵枢 ng 的独立插件包（split-r1，rel-v1.24 起）。核心 lingshu-ng 零依赖；第三方依赖只写在本包。
# 版本区间依据实测（Python 3.12：onnxruntime 1.31.0 · tokenizers 0.23.3 · numpy 2.5.4 · Pillow 12.3.0），区间外未测不承诺。
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lingshu-ng-embed"
dynamic = ["version"]
description = "灵枢 ng 插件：本地 ONNX 交叉编码重排 / 稠密向量 / 判别头（lingshu_ng.semrank、lingshu_ng.embed 的模型部分）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["lingshu-ng>=1.26,<2", "numpy>=2.3.5,<2.6", "onnxruntime>=1.31,<2", "tokenizers>=0.23,<1"]

[project.entry-points."lingshu_ng.plugins"]
embed = "lingshu_ng_embed.plugin:PLUGIN"

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Source = "https://github.com/TanPowasd/LingShu-prime/tree/main/Liyang/plugins/lingshu-ng-embed"

[tool.setuptools.dynamic]
version = { attr = "lingshu_ng_embed.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lingshu_ng_embed", "lingshu_ng_embed.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]
